name: CI

# Static site with no build step: we only syntax-check and run the Node test suite.
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check
        run: node --check markpaper.js

      - name: Parser tests
        run: node tests/parser.test.js
