<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- Content Security Policy: defense-in-depth on top of the in-app sanitizer.
         Scripts/styles are limited to self and the two pinned CDNs; embeds to YouTube/Vimeo. -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net;
      style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net;
      font-src https://cdn.jsdelivr.net;
      img-src * data:;
      media-src *;
      frame-src https://www.youtube.com https://www.youtube-nocookie.com https://player.vimeo.com;
      connect-src 'self';
      object-src 'none';
      base-uri 'self';
      form-action 'none'">
    <title>MarkPaper</title>
    <meta name="description" content="MarkPaper - Markdown to Clean Paper">
    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
    <link rel="manifest" href="assets/site.webmanifest">
    <!-- Warm up the CDN connections used for code highlighting and math -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <!-- MarkPaper -->
    <link rel="stylesheet" href="markpaper.css">
    <script src="markpaper.js" defer></script>
    <!-- Prism (Code highlighting); theme stylesheet is swapped at runtime, so no SRI on it -->
    <link id="prism-theme-link" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism-themes/1.9.0/prism-ghcolors.min.css">
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"
      integrity="sha384-MXybTpajaBV0AkcBaCPT4KIvo0FzoCiWXgcihYsw4FUkEz0Pv3JGV6tk2G8vJtDc"
      crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"
      integrity="sha384-Uq05+JLko69eOiPr39ta9bh7kld5PKZoU+fF7g0EXTAriEollhZ+DrN8Q/Oi8J2Q"
      crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <!-- KaTeX (LaTeX parser) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
      integrity="sha384-n8MVd4RsNIU0tAv4ct0nTaAbDJwPJzDEaqSD1odI+WdtXRGWt2kTvGFasHpSy3SV"
      crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
      integrity="sha384-XjKyOOlGwcjNTAIQHIpgOno0Hl1YQqzUOEleOLALmuqehneUG+vnGctmUb0ZY0l8"
      crossorigin="anonymous"></script>
  </head>

  <body>
    <main>
      <article id="content">
        <div class="loading-state">
          <div class="spinner"></div>
          <p>Loading document...</p>
        </div>
      </article>
    </main>
    <noscript>
      <div class="alert alert-warning">
        <strong>Warning:</strong> JavaScript is required to run MarkPaper. Please enable it in your browser settings.
      </div>
    </noscript>
  </body>

</html>
